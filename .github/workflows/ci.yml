name: CI

# Nothing but a person stood between a broken commit and the server. This is that check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The mobile head needs the MAUI workload and an Android SDK, which is several
      # minutes of setup for code that Core already covers. Core, Shared and the API are
      # what the server runs and what the tests exercise, so those are what CI builds.
      - name: Restore
        run: |
          dotnet restore TasteZambia.Core.Tests/TasteZambia.Core.Tests.csproj
          dotnet restore TasteZambia.API.Tests/TasteZambia.API.Tests.csproj

      # Warnings are worth seeing on every commit; --no-incremental so a cached
      # build cannot hide one a clean build would report.
      - name: Build
        run: |
          dotnet build TasteZambia.Core.Tests/TasteZambia.Core.Tests.csproj -c Release --no-restore --no-incremental
          dotnet build TasteZambia.API.Tests/TasteZambia.API.Tests.csproj -c Release --no-restore --no-incremental

      - name: Core tests
        run: dotnet test TasteZambia.Core.Tests/TasteZambia.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core.trx"

      # These start a real PostgreSQL through Testcontainers, so they need the Docker
      # daemon - present on ubuntu-latest runners, and the reason this job is not on macOS.
      - name: API tests
        run: dotnet test TasteZambia.API.Tests/TasteZambia.API.Tests.csproj -c Release --no-build --logger "trx;LogFileName=api.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # The files that would be quietly catastrophic to commit. Cheaper than a scanner,
      # and it names exactly what is wrong.
      - name: Check for signing keys and filled-in environment files
        run: |
          set -eu
          fail=0
          for path in TasteZambia.Mobile/signing.props .env.production infra/docker/.env.production; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked by git. It holds a secret and must stay gitignored."
              fail=1
            fi
          done
          if git ls-files | grep -E '\.(keystore|jks|p12)$' | grep -v '^Resources/'; then
            echo "::error::A keystore is tracked by git."
            fail=1
          fi
          # The signing key the API refuses to start with in Production. Outside the dev
          # defaults and the docs, its presence would be a real leak.
          if git grep -qI 'dev-only-signing-key' -- ':!TasteZambia.API/appsettings.Development.json' ':!*.md'; then
            echo "::error::The development signing key appears outside appsettings.Development.json."
            fail=1
          fi
          exit $fail
